    const tbody = document.getElementById("dictBody");

    totalBadge.textContent = `कुल प्रविष्टियाँ: ${ENTRIES.length.toLocaleString("hi-IN")}`;

    const voiceSelect = document.getElementById("voiceSelect");
    const modeSelect = document.getElementById("modeSelect");
    const rateSelect = document.getElementById("rateSelect");
    const stopSpeakBtn = document.getElementById("stopSpeakBtn");
    const audioStatus = document.getElementById("audioStatus");
    let availableVoices = [];
    let currentBtn = null;
    let currentRow = null;

    function normalizeForPureSpeech(text) {
      if (!text) return "";
      return text
        .replace(/\([^)]*\)/g, " ")
        .replace(/\//g, " , ")
        .replace(/ः/g, "ह")
        .replace(/ं/g, "ं")
        .replace(/\s+/g, " ")
        .trim();
    }

    function populateVoices() {
      if (!("speechSynthesis" in window)) {
        audioStatus.innerHTML = '<span class="lively-pill">ऑडियो सूचना</span> इस ब्राउज़र में SpeechSynthesis समर्थित नहीं है।';
        return;
      }
      availableVoices = window.speechSynthesis.getVoices() || [];
      const prev = voiceSelect.value;
      voiceSelect.innerHTML = '<option value="auto">आवाज़: शुद्ध स्वचालित (hi-IN)</option>';
      const sorted = [...availableVoices].sort((a, b) => {
        const aHi = (a.lang || "").toLowerCase().startsWith("hi") ? 0 : 1;
        const bHi = (b.lang || "").toLowerCase().startsWith("hi") ? 0 : 1;
        if (aHi !== bHi) return aHi - bHi;
        return (a.name || "").localeCompare(b.name || "");
      });
      sorted.forEach((v, i) => {
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = `${v.name} (${v.lang})`;
        voiceSelect.appendChild(opt);
      });
      if (prev && Array.from(voiceSelect.options).some((o) => o.value === prev)) {
        voiceSelect.value = prev;
      }
      const hiCount = availableVoices.filter((v) => (v.lang || "").toLowerCase().startsWith("hi")).length;
      audioStatus.innerHTML = hiCount > 0
        ? `<span class="lively-pill">जीवंत उच्चारण तैयार</span> ${hiCount} हिन्दी (hi-IN) आवाज़ उपलब्ध हैं — हर शब्द पर क्लिक करके स्पष्ट अर्थ सहित सुनें।`
        : '<span class="lively-pill">जीवंत उच्चारण तैयार</span> ब्राउज़र की उपलब्ध आवाज़ से स्पष्ट उच्चारण चलेगा।';
    }

    function resetSpeakingButton() {
      if (currentBtn) {
        currentBtn.classList.remove("speaking");
        currentBtn.textContent = "🔊 सुनें";
        currentBtn = null;
      }
      if (currentRow) {
        currentRow.classList.remove("row-speaking");
        currentRow = null;
      }
    }

    function stopSpeech() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      resetSpeakingButton();
    }

    function pickVoiceForLang(preferEnglish = false) {
      const selectedIdx = voiceSelect.value;
      if (selectedIdx !== "auto" && availableVoices[Number(selectedIdx)]) {
        return availableVoices[Number(selectedIdx)];
      }
      if (preferEnglish) {
        return (
          availableVoices.find((v) => (v.lang || "").toLowerCase() === "en-in") ||
          availableVoices.find((v) => (v.lang || "").toLowerCase().startsWith("en")) ||
          availableVoices.find((v) => (v.lang || "").toLowerCase().startsWith("hi")) ||
          null
        );
      }
      return (
        availableVoices.find((v) => (v.lang || "").toLowerCase() === "hi-in") ||
        availableVoices.find((v) => (v.lang || "").toLowerCase().startsWith("hi")) ||
        availableVoices.find((v) => (v.lang || "").toLowerCase().startsWith("en-in")) ||
        null
      );
    }

    function speakEntry(item, btn, row) {
      if (!("speechSynthesis" in window)) {
        audioStatus.innerHTML = '<span class="lively-pill">सूचना</span> इस ब्राउज़र में ऑडियो उच्चारण उपलब्ध नहीं है।';
        return;
      }
      const wasThis = currentBtn === btn;
      stopSpeech();
      if (wasThis) return;

      const hoWord = normalizeForPureSpeech(item.ho || "");
      const hiMeaning = normalizeForPureSpeech(item.hi || "");
      const enMeaning = normalizeForPureSpeech(item.en || "");
      const mode = modeSelect.value || "lively";
      const baseRate = parseFloat(rateSelect.value || "0.92");

      const queue = [];
      if (hoWord) {
        queue.push({ text: hoWord, lang: "hi-IN", rate: Math.max(0.7, baseRate - 0.04), pitch: 1.05 });
      }
      if (mode !== "wordOnly" && hiMeaning) {
        queue.push({ text: `अर्थ: ${hiMeaning}`, lang: "hi-IN", rate: baseRate, pitch: 1.0 });
      }
      if (mode === "full" && enMeaning) {
        queue.push({ text: enMeaning, lang: "en-IN", rate: baseRate, pitch: 1.0 });
      }
      if (!queue.length) return;

      currentBtn = btn;
      currentRow = row;
      btn.classList.add("speaking");
      btn.textContent = "⏸ बोल रहा है";
      if (row) row.classList.add("row-speaking");

      let step = 0;
      function playNext() {
        if (currentBtn !== btn) return;
        if (step >= queue.length) {
          resetSpeakingButton();
          return;
        }
        const seg = queue[step++];
        const utter = new SpeechSynthesisUtterance(seg.text);
        const chosenVoice = pickVoiceForLang(seg.lang.startsWith("en"));
        if (chosenVoice) {
          utter.voice = chosenVoice;
          utter.lang = chosenVoice.lang || seg.lang;
        } else {
          utter.lang = seg.lang;
        }
        utter.rate = seg.rate;
        utter.pitch = seg.pitch;
        utter.volume = 1.0;

        utter.onend = () => {
          if (currentBtn === btn) playNext();
        };
        utter.onerror = () => {
          resetSpeakingButton();
          audioStatus.innerHTML = '<span class="lively-pill">ध्यान दें</span> उच्चारण चलाने में समस्या आई; कृपया ब्राउज़र की आवाज़ या स्पीकर जाँचें।';
        };
        window.speechSynthesis.speak(utter);
      }

      playNext();
    }

    stopSpeakBtn.addEventListener("click", stopSpeech);
    if ("speechSynthesis" in window) {
      populateVoices();
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    searchInput.addEventListener("input", (ev) => renderRows(ev.target.value));
    renderRows();
  </script>
</body>
</html>
